spring:
  application:
    name: optimize-land-reg
    version: 1.0.0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB
  profiles:
    active: poc
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  config:
    import: optional:file:${user.home}/.${spring.application.name}/config/application.yml
  docker:
    compose:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: afis-master
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual
  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      fail-on-empty-beans: false
  boot:
    admin:
      client:
        url: http://localhost:1111
        instance:
#          service-base-url: http://localhost:1111
          service-host-type: IP
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      AFIS-MASTER:
        baseConfig: default

loki:
  url: ${LOKI_URL:https://logs-prod-028.grafana.net/loki/api/v1/push}
  user-id: ${LOKI_USER_ID:1114217}
  api-key: ${LOKI_API_KEY}

landreg:
  storage:
    enabled: false
    claim-check-enabled: false
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    queue-bucket: queue-processing
    store-bucket: store
  backfill:
    enabled: false
    cron: "0 0 2 * * *"
  afis:
    pipeline-version: v2
    qdrant:
      host: localhost
      grpc-port: 6334
      collection: fingerprints
      vector-size: 512
    onnx:
      model-path: classpath:models/fingerprint_embedding.onnx
